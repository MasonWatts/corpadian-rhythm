<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corpadian Rhythm Visualization</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Corpadian Rhythm</h1>
            <p class="subtitle">A visualization of corporate work satisfaction cycles</p>
            <p><a href="https://github.com/MasonWatts/corpadian-rhythm" target="_blank" class="project-link">View on GitHub →</a></p>
        </header>

        <main>
            <div class="cycle-weights-section">
                <h3>Cycle Weights</h3>
                <p class="weights-description">Adjust the relative importance of each cycle:</p>
                <div class="weight-controls">
                    <div class="weight-control">
                        <label for="monthWeight">
                            <span class="weight-label">Month Cycle</span>
                            <span class="weight-color" style="background-color: #e74c3c;"></span>
                        </label>
                        <div class="weight-input-group">
                            <input type="range" id="monthWeight" class="weight-slider" min="10" max="150" step="5" value="100">
                            <span id="monthWeightValue" class="weight-value">100</span>
                        </div>
                    </div>

                    <div class="weight-control">
                        <label for="weekWeight">
                            <span class="weight-label">Week Cycle</span>
                            <span class="weight-color" style="background-color: #27ae60;"></span>
                        </label>
                        <div class="weight-input-group">
                            <input type="range" id="weekWeight" class="weight-slider" min="10" max="150" step="5" value="70">
                            <span id="weekWeightValue" class="weight-value">70</span>
                        </div>
                    </div>

                    <div class="weight-control">
                        <label for="dayWeight">
                            <span class="weight-label">Day Cycle</span>
                            <span class="weight-color" style="background-color: #3498db;"></span>
                        </label>
                        <div class="weight-input-group">
                            <input type="range" id="dayWeight" class="weight-slider" min="10" max="150" step="5" value="50">
                            <span id="dayWeightValue" class="weight-value">50</span>
                        </div>
                    </div>
                </div>
                <button id="resetWeightsBtn">Reset to Defaults</button>
            </div>
            <div class="controls">
                    <button id="playPauseBtn">Play</button>
                    <button id="resetBtn">Reset</button>
                    <div class="speed-control">
                        <label for="speedSlider">Speed:</label>
                        <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1">
                        <span id="speedValue">1.0x</span>
                    </div>
                </div>
            <div class="visualization-section">
                <div class="canvas-wrapper">
                    <canvas id="linkageCanvas" width="600" height="600"></canvas>
                </div>
            </div>

            <div class="graph-section">
                <canvas id="graphCanvas" width="800" height="300"></canvas>
                <p class="time-display">Time: <span id="timeDisplay">Day 1 (Mon), 9:00 AM</span></p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Mason Watts. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/simulation.js"></script>
    <script src="js/visualization.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
